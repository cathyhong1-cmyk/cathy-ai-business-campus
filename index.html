<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cathy AI 비즈니스 캠퍼스 · 교안</title>
<meta name="description" content="Cathy AI 비즈니스 캠퍼스 교안 모음">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:ital@1&display=swap" rel="stylesheet">
<style>
  :root{--navy:#1B2A4A;--gold:#C9A84C;--gold-soft:#e3cd8a;--paper:#f6f4ee;--muted:#6b7280;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans KR',sans-serif;background:var(--navy);color:#fff;
       min-height:100vh;display:flex;flex-direction:column;}
  .wrap{max-width:880px;width:100%;margin:0 auto;padding:64px 28px 48px;flex:1;}
  .brand{font-size:16px;font-weight:700;letter-spacing:.16em;color:var(--gold);text-transform:uppercase;}
  h1{font-size:40px;font-weight:900;line-height:1.2;margin:14px 0 6px;}
  h1 b{color:var(--gold);}
  .sub{font-family:'Noto Serif KR',serif;font-style:italic;color:var(--gold-soft);font-size:19px;margin-bottom:8px;}
  .lead{color:#cdd6e6;font-size:17px;line-height:1.6;margin:0 0 36px;max-width:620px;}
  .rule{width:60px;height:4px;background:var(--gold);margin:0 0 36px;}
  .seclabel{font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;margin-bottom:16px;}
  .docs{display:flex;flex-direction:column;gap:14px;}
  a.doc{display:flex;align-items:center;gap:20px;text-decoration:none;color:inherit;
        background:rgba(255,255,255,.05);border:1px solid rgba(201,168,76,.3);border-radius:14px;
        padding:22px 26px;transition:.18s;}
  a.doc:hover{background:rgba(201,168,76,.12);border-color:var(--gold);transform:translateY(-2px);}
  .doc .no{flex:0 0 auto;font-size:26px;font-weight:900;color:var(--gold);width:64px;}
  .doc .body{flex:1;}
  .doc .t{font-size:21px;font-weight:700;margin-bottom:4px;}
  .doc .d{font-size:15px;color:#aeb9cd;}
  .doc .arrow{color:var(--gold);font-size:24px;}
  footer{border-top:1px solid rgba(201,168,76,.25);padding:18px 28px;text-align:center;
         font-size:13px;color:var(--muted);background:rgba(0,0,0,.15);}
  @media(max-width:640px){h1{font-size:28px;}.wrap{padding:44px 20px;}a.doc{padding:18px 18px;gap:14px;}.doc .no{width:48px;font-size:22px;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Cathy AI 비즈니스 캠퍼스 · 2기</div>
  <h1>인생매토 <b>Cathy</b> 교안</h1>
  <div class="sub">Entrepreneurial Learning Library</div>
  <p class="lead">중장년 창업가 과정에서 사용하는 교안을 한곳에 모았습니다. 아래에서 원하는 강의를 선택하세요.</p>
  <div class="rule"></div>
  <div class="seclabel">강의 목록</div>
  <div class="docs">
    <a class="doc" href="/doc1">
      <div class="no">1-1</div>
      <div class="body">
        <div class="t">창업가 마인드셋과 자기진단</div>
        <div class="d">Entrepreneurial Mindset &amp; Self-Assessment · 30분</div>
      </div>
      <div class="arrow">→</div>
    </a>
    <!-- 교안 추가 시 위 블록을 복사해 href="/doc2/" 등으로 바꿔 넣으세요 -->
  </div>
</div>
<footer>본 자료의 무단 복제 또는 배포를 금합니다 · © Cathy AI 비즈니스 캠퍼스</footer>
</body>
</html>
